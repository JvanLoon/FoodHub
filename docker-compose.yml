# FoodHub self-hosted stack: db (PostgreSQL) + pgAdmin + api + web (no Aspire).
#
#   docker compose up -d --build      start / rebuild
#   docker compose down               stop  (KEEPS the data volume)
#   docker compose down -v            stop AND delete the database  <-- avoid
#
# The Postgres data lives in the named volume `pgdata`, so tearing the containers
# down and recomposing keeps every recipe/user intact. Only `-v` wipes it.
#
# Admin panel: pgAdmin at http://localhost:5050 (login below). Add a server
# pointing at host `db`, port 5432, user `foodhub` to browse tables and use the
# restore/import feature to reset the data.

# Secrets come from a local .env file (see .env.example); none are committed.
# NB: POSTGRES_PASSWORD is only read when the volume is EMPTY. Changing it later
# does not change the role's password on an existing `pgdata` volume — you have to
# ALTER USER inside the container, or `docker compose down -v` and start over.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: foodhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: FoodCalc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U foodhub -d FoodCalc" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@foodhub.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      # Skip the connect-time master-password prompt on this local-only panel.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: FoodCalc.Api/DockerFile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Internal docker-network address of the web app (used for CORS origin).
      - WebServer__BaseAddress=http://web:8080
      # EF Core migrations (run at API startup) create the whole schema, so no
      # init script is needed. `db` is the docker-network hostname of Postgres.
      - "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FoodCalc;Username=foodhub;Password=${POSTGRES_PASSWORD:?}"
      - Jwt__Key=${JWT_KEY:?set JWT_KEY in .env}
      - Jwt__Issuer=FoodCalc
      - Jwt__Audience=FoodHub-Api-user
      # One-shot: creates the first admin only while the users table is empty.
      # Clear both once you have signed in and changed the password.
      - Bootstrap__AdminEmail=${BOOTSTRAP_ADMIN_EMAIL:-}
      - Bootstrap__AdminPassword=${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:8080"

  web:
    build:
      context: .
      dockerfile: FoodCalc.Web/DockerFile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Internal docker-network address of the API.
      - API__BaseAddress=http://api:8080
      # No Jwt__* here on purpose. The tokens are HS256, so the key signs as well as
      # verifies and anyone holding it can forge an admin token. This is the container
      # the tunnel exposes; the API, which does need the key, publishes no ports. The
      # front end only reads claims to decide what to render, which needs no key, and
      # the API re-checks every request anyway.
    volumes:
      # DataProtection keys: persisted so auth/antiforgery survive a recompose.
      # Path matches Environment.SpecialFolder.LocalApplicationData for root.
      - dataprotection-keys:/root/.local/share/FoodHub/dataprotection-keys
    depends_on:
      - api
    ports:
      - "5002:8080"

volumes:
  pgdata:
  pgadmin-data:
  dataprotection-keys:
