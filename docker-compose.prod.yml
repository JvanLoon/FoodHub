# Production stack: Cloudflare Tunnel -> web -> api -> db.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development docker-compose.yml:
#   • NOTHING is published on the host. cloudflared makes an outbound connection
#     to Cloudflare and traffic arrives back down it, so there is no inbound port,
#     no router forwarding and no firewall hole. This is also what makes clearing
#     KnownIPNetworks in the ForwardedHeaders config safe.
#   • TLS is terminated at Cloudflare's edge, so there is no reverse proxy here
#     and no certificate to renew.
#   • No pgAdmin. Reach the database over an SSH tunnel instead of exposing it.
#   • Postgres has no host port mapping.
#   • restart: unless-stopped everywhere, so the stack survives a reboot.
#
# Every value comes from .env — see .env.example.

services:
  # The only route in. Because it shares this compose network it can resolve
  # `web` by name — the tunnel's public hostname must point at http://web:8080,
  # NOT localhost, which inside this container means cloudflared itself.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Named-tunnel token from the Zero Trust dashboard. It embeds the tunnel's
      # credentials — treat it exactly like a password.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - web

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: FoodCalc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U foodhub -d FoodCalc" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: FoodCalc.Api/DockerFile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Public origin of the front end — this is the CORS allow-list entry, so it
      # must be the browser-visible URL, not the internal container address.
      - WebServer__BaseAddress=https://${PUBLIC_HOSTNAME}
      - "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FoodCalc;Username=foodhub;Password=${POSTGRES_PASSWORD:?}"
      - Jwt__Key=${JWT_KEY:?set JWT_KEY in .env}
      - Jwt__Issuer=FoodCalc
      # First boot only. Blank these and `up -d` again once you have signed in.
      - Bootstrap__AdminEmail=${BOOTSTRAP_ADMIN_EMAIL:-}
      - Bootstrap__AdminPassword=${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: FoodCalc.Web/DockerFile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - API__BaseAddress=http://api:8080
      # No Jwt__* here on purpose. The tokens are HS256, so the key signs as well as
      # verifies and anyone holding it can forge a token for any account and any role.
      # This is the container cloudflared exposes; the api service, which does need the
      # key, publishes no ports at all. Handing the key to the reachable process undid
      # part of that isolation and bought nothing — the front end only reads claims to
      # decide what to render, which needs no key, and the API re-checks every request.
    volumes:
      # DataProtection keys. If this volume is lost every session cookie and
      # antiforgery token is invalidated and users are silently logged out.
      - dataprotection-keys:/root/.local/share/FoodHub/dataprotection-keys
    depends_on:
      - api

volumes:
  pgdata:
  dataprotection-keys:
