# Overlay for testing WITHOUT a domain.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.quicktunnel.yml up -d --build
#
# Replaces the named tunnel with an anonymous "quick tunnel": Cloudflare hands
# out a random https://<words>.trycloudflare.com URL, no account, no zone, no
# token. Read the URL out of the logs:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.quicktunnel.yml logs cloudflared | grep trycloudflare
#
# The URL is NEW on every restart of the container, and PUBLIC_HOSTNAME must be
# set to match it or the API rejects the browser's calls with a CORS error. That
# is the whole reason this is a test rig and not a deployment: swap to a real
# domain and the named tunnel as soon as the stack is proven.

services:
  cloudflared:
    command: tunnel --no-autoupdate --url http://web:8080
    environment:
      # A quick tunnel has no token. This blanks the base file's required
      # ${CLOUDFLARE_TUNNEL_TOKEN:?...} — verified with `compose config`, the
      # override wins and the variable does not need to be in .env at all.
      TUNNEL_TOKEN: ""
